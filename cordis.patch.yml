# The dsh-agp-askdata bundle patch: activates the plugin as a profile layer.
#
# feature/schema-validation 分支：通过 AGP REST API 取数（/s1M6_uE9/wz/），
# 不直连 StarRocks/MySQL。8 个 API 工具（list_models/model_attributes/
# query_model/tag_real/tag_history/tag_wide/tag_aggregate/resolve_tag）。
#
# 凭据通过环境变量注入（AGP_API_TOKEN / AGP_API_OPENID），不落盘不进日志。
# connection/mysqlConnection 保留但本分支不使用（tsdbChannel 走 API 通道）。
- insert:
    - id: askdata
      name: 'dsh-agp-askdata'
      config:
        connection:
          host: '192.168.101.54'
          port: 9030
          user: 'root'
          password: ''
          database: 'WT_DB'
          driver: 'mysql2'
        mysqlConnection:
          host: '192.168.101.54'
          port: 3306
          user: 'root'
          password: 'Aa123456.'
          database: 'wisetao_meta'
        api:
          baseUrl: 'https://www.openagp.top:9080'
          apiPrefix: '/s1M6_uE9'
          token: '${AGP_API_TOKEN}'
          openid: '${AGP_API_OPENID}'
          projectId: '10462'
          timeoutMs: 15000
          maxPageSize: 1000
